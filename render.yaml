# Render Blueprint for FoodFlow, single-server hosting: the Express API
# serves the built frontend (client/dist) with SPA fallback, so one
# service + one URL runs the whole product (API, site, realtime).
# Secrets marked `sync: false` must be filled in the dashboard —
# they are never committed to git.
services:
  - type: web
    name: foodflow
    runtime: node
    plan: free
    # Root build compiles the server AND the client (VITE_* left empty so
    # the site calls the same origin: no CORS issues, QR links just work).
    buildCommand: npm ci && npm run build
    # --seed only seeds an empty database (admin, canteen, menu, QR codes).
    startCommand: npm run start -w server -- --seed
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set to the hosted frontend origin after deploying it, e.g.
      # https://foodflow-client.vercel.app (no trailing slash).
      - key: CLIENT_URL
        value: https://REPLACE-WITH-FRONTEND-URL
      - key: EXTRA_ORIGINS
        value: ''
      # Free MongoDB Atlas M0 URI goes here (dashboard → Environment):
      # mongodb+srv://<user>:<password>@<cluster>.mongodb.net/foodflow?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      # Supabase user accounts (server-side only — never commit the service key).
      - key: SUPABASE_URL
        value: https://xkssgwkmvxikvxujciwb.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Canteen Admin
      - key: ADMIN_EMAIL
        value: admin@foodflow.edu
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: '9000000000'
      # Razorpay test keys (Key ID is public; secret is NEVER committed —
      # paste the secret in the Render dashboard → Environment).
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        value: rzp_test_ThWJn7gn5ykCVw
      - key: RAZORPAY_KEY_SECRET
        sync: false
